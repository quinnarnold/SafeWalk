name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private location data, or security vulnerabilities. Report security issues through GitHub's private vulnerability reporting flow.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence and sanitized logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision and environment
      description: Commit SHA, iOS version/device or backend platform, and relevant dependency versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials and private or precise location data.
          required: true
