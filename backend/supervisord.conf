[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[program:fastapi]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app/python
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
startsecs=30
startretries=5

[program:fastify]
command=/usr/local/bin/bun run /app/ts/src/index.ts
directory=/app/ts
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=200
startsecs=20
startretries=5

[eventlistener:exit_on_any_fatal]
command=/bin/bash -c "echo READY && while read line; do echo \"$line\" | grep -q 'FATAL' && kill -SIGTERM $(cat /tmp/supervisord.pid); done"
events=PROCESS_STATE_FATAL
buffer_size=10
